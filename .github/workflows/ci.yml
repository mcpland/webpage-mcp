name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck, Test, Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate pull request commit metadata
        if: github.event_name == 'pull_request' && matrix.node-version == 24
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: Audit production npm dependencies
        if: matrix.node-version == 24
        run: pnpm audit --prod

      - name: Audit published MCP dependency closure
        if: matrix.node-version == 24
        run: |
          pnpm shrinkwrap:mcp:check
          pnpm shrinkwrap:mcp:check-current
          npm audit --omit=dev --package-lock-only --prefix app/mcp-server --audit-level=low
          pnpm audit:mcp-bundle

      - name: Verify reviewed legal notices
        if: matrix.node-version == 24
        run: pnpm legal:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck (shared + native)
        run: pnpm typecheck

      - name: Typecheck (extension)
        run: pnpm --filter webpage-mcp-connector compile

      - name: Test
        env:
          ENFORCE_COVERAGE: "true"
        run: |
          pnpm test:release
          pnpm test:workspace
          pnpm -r --if-present test

      - name: Build
        run: pnpm build

  verify-windows:
    name: Windows Test and Build
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: |
          pnpm lint
          pnpm typecheck
          pnpm --filter webpage-mcp-connector compile

      - name: Test cross-platform scripts and applications
        run: |
          pnpm test:release
          pnpm test:workspace
          pnpm --filter webpage-mcp test
          pnpm --filter webpage-mcp-connector test

      - name: Build
        run: pnpm build

  verify-macos-native-registration:
    name: macOS Native Registration Smoke (Node 24)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm build:shared

      - name: Pack MCP npm package
        run: |
          mkdir -p "$RUNNER_TEMP/webpage-mcp-pack"
          pnpm --dir app/mcp-server pack --pack-destination "$RUNNER_TEMP/webpage-mcp-pack"

      - name: Verify fresh npm consumer dependency graph
        run: |
          PACKAGE_VERSION="$(node -p "require('./app/mcp-server/package.json').version")"
          node scripts/verify-packed-mcp-consumer.mjs "$RUNNER_TEMP/webpage-mcp-pack/webpage-mcp-${PACKAGE_VERSION}.tgz"

      - name: Install, register, and diagnose native host in isolation
        shell: bash
        run: |
          set -euo pipefail

          ORIGINAL_HOME="$HOME"
          SMOKE_ROOT="$(mktemp -d "$RUNNER_TEMP/webpage-mcp-native-registration.XXXXXX")"
          trap 'rm -rf "$SMOKE_ROOT"' EXIT

          export HOME="$SMOKE_ROOT/home"
          export npm_config_prefix="$SMOKE_ROOT/npm-prefix"
          export npm_config_cache="$SMOKE_ROOT/npm-cache"
          export npm_config_userconfig="$SMOKE_ROOT/npmrc"
          mkdir -p "$HOME" "$npm_config_prefix" "$npm_config_cache"

          if [ "$HOME" = "$ORIGINAL_HOME" ]; then
            echo "Refusing to run native registration against the runner user's real HOME"
            exit 1
          fi
          case "$HOME" in
            "$RUNNER_TEMP"/*) ;;
            *)
              echo "Isolated HOME must stay beneath RUNNER_TEMP: $HOME"
              exit 1
              ;;
          esac

          node --input-type=module -e \
            'import assert from "node:assert/strict"; import os from "node:os"; assert.equal(os.homedir(), process.env.HOME);'

          PACKAGE_VERSION="$(node -p "require('./app/mcp-server/package.json').version")"
          PACKAGE_TGZ="$RUNNER_TEMP/webpage-mcp-pack/webpage-mcp-${PACKAGE_VERSION}.tgz"
          test -f "$PACKAGE_TGZ"

          npm install --global --foreground-scripts "$PACKAGE_TGZ"
          CLI="$npm_config_prefix/bin/webpage-mcp"
          test -x "$CLI"

          "$CLI" register --browser chrome --force
          DOCTOR_REPORT="$SMOKE_ROOT/doctor.json"
          "$CLI" doctor --json --browser chrome > "$DOCTOR_REPORT"

          export SMOKE_ROOT ORIGINAL_HOME DOCTOR_REPORT
          node scripts/verify-macos-native-registration-smoke.mjs

  verify-browser-native-handshake:
    name: Chrome Extension and Native Host Handshake (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      # Branded Chrome removed --load-extension in milestone 137. Chrome for
      # Testing intentionally retains it for extension automation.
      - name: Setup Chrome for Testing
        id: chrome-for-testing
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native host and keyed extension
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_IDENTITY="$(node scripts/browser-native-smoke-identity.mjs)"
          CHROME_EXTENSION_PUBLIC_KEY="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.encodedPublicKey)' "$SMOKE_IDENTITY")"
          SMOKE_EXTENSION_ID="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.extensionId)' "$SMOKE_IDENTITY")"
          echo "SMOKE_EXTENSION_ID=$SMOKE_EXTENSION_ID" >> "$GITHUB_ENV"
          export CHROME_EXTENSION_PUBLIC_KEY
          pnpm build:shared
          pnpm build:mcp
          pnpm build:extension

      - name: Verify real Chrome Native Messaging handshake
        shell: bash
        env:
          WEBPAGE_MCP_CHROME_BINARY: ${{ steps.chrome-for-testing.outputs.chrome-path }}
          WEBPAGE_MCP_EXTENSION_DIR: ${{ github.workspace }}/app/chrome-extension/.output/chrome-mv3
          WEBPAGE_MCP_EXPECTED_EXTENSION_ID: ${{ env.SMOKE_EXTENSION_ID }}
        run: |
          set -euo pipefail
          ORIGINAL_HOME="$HOME"
          SMOKE_ROOT="$(mktemp -d "$RUNNER_TEMP/webpage-mcp-browser-native.XXXXXX")"
          trap 'rm -rf "$SMOKE_ROOT"' EXIT
          export HOME="$SMOKE_ROOT/home"
          mkdir -p "$HOME"
          test "$HOME" != "$ORIGINAL_HOME"
          node app/mcp-server/dist/cli.js register \
            --browser chrome \
            --force \
            --extension-id "$SMOKE_EXTENSION_ID"
          node scripts/verify-browser-native-handshake.mjs

  wasm-artifacts:
    name: Rebuild and verify WASM artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.94.0
          rustc --version

      - name: Install verified cargo-deny
        run: node scripts/install-cargo-deny.mjs --install-dir "$RUNNER_TEMP/webpage-mcp-cargo-deny"

      # cargo-deny's --locked flag also disables advisory-database updates.
      # Validate the committed graph separately, then keep the live advisory
      # fetch enabled and fail if either the fetch/check or lockfile guard fails.
      - name: Audit Rust dependencies
        run: |
          cargo metadata --manifest-path packages/wasm-simd/Cargo.toml --all-features --locked --format-version 1 > /dev/null
          "$RUNNER_TEMP/webpage-mcp-cargo-deny/cargo-deny" --manifest-path packages/wasm-simd/Cargo.toml --all-features check --config deny.toml advisories
          git diff --exit-code -- packages/wasm-simd/Cargo.lock

      - name: Install verified wasm-pack
        run: node scripts/install-wasm-pack.mjs --install-dir "$RUNNER_TEMP/webpage-mcp-wasm-pack"

      - name: Test Rust implementation
        run: cargo test --manifest-path packages/wasm-simd/Cargo.toml --locked

      - name: Rebuild generated runtime artifacts
        id: rebuild-wasm
        env:
          WASM_PACK_BINARY: ${{ runner.temp }}/webpage-mcp-wasm-pack/wasm-pack
        run: node packages/wasm-simd/scripts/wasm-artifacts.mjs sync

      - name: Verify generated runtime artifacts
        id: verify-wasm
        run: |
          git diff --exit-code -- packages/wasm-simd/artifacts.json \
            app/chrome-extension/workers/simd_math.js \
            app/chrome-extension/workers/simd_math_bg.wasm

      - name: Upload rebuilt runtime artifact evidence
        if: ${{ always() && steps.rebuild-wasm.outcome == 'success' && steps.verify-wasm.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebuilt-wasm-runtime-${{ github.sha }}
          path: |
            packages/wasm-simd/artifacts.json
            app/chrome-extension/workers/simd_math.js
            app/chrome-extension/workers/simd_math_bg.wasm
          if-no-files-found: error
          retention-days: 1
