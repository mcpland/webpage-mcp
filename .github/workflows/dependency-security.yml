name: Dependency Security

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit npm and Rust production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      # Resolve metadata without installing or executing dependency lifecycle
      # code, then scan both committed dependency closures.
      - name: Audit production npm dependencies
        run: pnpm audit --prod

      - name: Audit published MCP dependency closure
        run: |
          pnpm shrinkwrap:mcp:check
          pnpm shrinkwrap:mcp:check-current
          npm audit --omit=dev --package-lock-only --prefix app/mcp-server --audit-level=low
          pnpm audit:mcp-bundle

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
          rustc --version

      - name: Install verified cargo-deny
        run: node scripts/install-cargo-deny.mjs --install-dir "$RUNNER_TEMP/webpage-mcp-cargo-deny"

      # Do not pass cargo-deny's --locked flag here: that flag disables live
      # advisory-database updates. Cargo validates the lock separately first.
      - name: Audit Rust dependencies
        run: |
          cargo metadata --manifest-path packages/wasm-simd/Cargo.toml --all-features --locked --format-version 1 > /dev/null
          "$RUNNER_TEMP/webpage-mcp-cargo-deny/cargo-deny" --manifest-path packages/wasm-simd/Cargo.toml --all-features check --config deny.toml advisories
          git diff --exit-code -- packages/wasm-simd/Cargo.lock
