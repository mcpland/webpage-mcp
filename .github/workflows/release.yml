name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish webpage-mcp to npm
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  # This is the public DER-SPKI body from Chrome Web Store, not a secret/private key.
  CHROME_EXTENSION_PUBLIC_KEY: ${{ vars.CHROME_EXTENSION_PUBLIC_KEY }}
  CHROME_EXTENSION_EXPECTED_ID: iehgbogeakiedihodennfcnigojnncag
  WEBPAGE_MCP_REQUIRE_EXTENSION_PUBLIC_KEY: "true"

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-identity:
    name: Bind Exact Release Commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.bind_release_sha.outputs.release_sha }}

    steps:
      - name: Checkout event object
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Bind exact release commit
        id: bind_release_sha
        shell: bash
        env:
          EVENT_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_RELEASE_SHA="$(git rev-parse HEAD)"
          EVENT_COMMIT_SHA="$(git rev-parse "${EVENT_RELEASE_SHA}^{commit}")"
          if [[ ! "$ACTUAL_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release commit SHA: $ACTUAL_RELEASE_SHA"
            exit 1
          fi
          if [ "$ACTUAL_RELEASE_SHA" != "$EVENT_COMMIT_SHA" ]; then
            echo "Checked out $ACTUAL_RELEASE_SHA but event resolves to $EVENT_COMMIT_SHA"
            exit 1
          fi
          echo "release_sha=$ACTUAL_RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js for release preflight
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Verify release metadata before platform gates
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/release-preflight.mjs metadata --tag "$RELEASE_TAG"

      - name: Verify npm publish ref before platform gates
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_npm == true)
        run: node scripts/release-preflight.mjs npm-publish --ref "$GITHUB_REF"

  release-platform-gate:
    name: Platform Gate (${{ matrix.platform }})
    needs: release-identity
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            enforce_coverage: true
          - platform: Windows
            os: windows-latest
            enforce_coverage: false
          - platform: macOS
            os: macos-latest
            enforce_coverage: false

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.release-identity.outputs.release_sha }}

      - name: Verify exact release checkout
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.release-identity.outputs.release_sha }}
        run: |
          set -euo pipefail
          ACTUAL_RELEASE_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_RELEASE_SHA" != "$EXPECTED_RELEASE_SHA" ]; then
            echo "Checked out $ACTUAL_RELEASE_SHA but expected $EXPECTED_RELEASE_SHA"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production npm dependencies once on Linux
        if: matrix.enforce_coverage
        run: pnpm audit --prod

      - name: Install pinned Rust for advisory scan once on Linux
        if: matrix.enforce_coverage
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
          rustc --version

      - name: Install verified cargo-deny once on Linux
        if: matrix.enforce_coverage
        run: node scripts/install-cargo-deny.mjs --install-dir "$RUNNER_TEMP/webpage-mcp-cargo-deny"

      # cargo-deny's --locked flag disables live advisory-database updates.
      # Validate the committed graph separately, then leave fetching enabled.
      - name: Audit Rust dependencies once on Linux
        if: matrix.enforce_coverage
        run: |
          cargo metadata --manifest-path packages/wasm-simd/Cargo.toml --all-features --locked --format-version 1 > /dev/null
          "$RUNNER_TEMP/webpage-mcp-cargo-deny/cargo-deny" --manifest-path packages/wasm-simd/Cargo.toml --all-features check advisories
          git diff --exit-code -- packages/wasm-simd/Cargo.lock

      - name: Lint once on Linux
        if: matrix.enforce_coverage
        run: pnpm lint

      - name: Typecheck workspace
        run: |
          pnpm typecheck
          pnpm --filter webpage-mcp-connector compile

      - name: Test workspace
        env:
          ENFORCE_COVERAGE: ${{ matrix.enforce_coverage && 'true' || 'false' }}
        run: |
          pnpm test:release
          pnpm test:workspace
          pnpm -r --if-present test

      - name: Build workspace
        run: pnpm build

      # This executes the built platform wrapper and exchanges a native
      # ping/pong frame. Launch through a real installed browser remains manual.
      - name: Verify native host wrapper handshake
        run: node scripts/verify-native-host-wrapper.mjs

  build-assets:
    name: Build Release Assets
    needs:
      - release-identity
      - release-platform-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      release_sha: ${{ steps.verify_release_sha.outputs.release_sha }}

    steps:
      - name: Checkout exact gated commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.release-identity.outputs.release_sha }}

      - name: Verify exact gated checkout
        id: verify_release_sha
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.release-identity.outputs.release_sha }}
        run: |
          set -euo pipefail
          ACTUAL_RELEASE_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_RELEASE_SHA" != "$EXPECTED_RELEASE_SHA" ]; then
            echo "Checked out $ACTUAL_RELEASE_SHA but expected $EXPECTED_RELEASE_SHA"
            exit 1
          fi
          echo "release_sha=$ACTUAL_RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/release-preflight.mjs metadata --tag "$RELEASE_TAG"

      - name: Verify npm publish ref
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_npm == true)
        run: node scripts/release-preflight.mjs npm-publish --ref "$GITHUB_REF"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install pinned Rust and WASM toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal --target wasm32-unknown-unknown
          cargo install wasm-pack --version '=0.15.0' --locked
          rustc --version
          wasm-pack --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify reproducible WASM runtime
        run: |
          cargo test --manifest-path packages/wasm-simd/Cargo.toml --locked
          pnpm verify:wasm

      - name: Build workspace
        run: pnpm build

      - name: Build extension zip
        run: pnpm --filter webpage-mcp-connector zip

      - name: Pack MCP npm package
        run: |
          mkdir -p artifacts/mcp
          pnpm --dir app/mcp-server pack --pack-destination ../../artifacts/mcp

      - name: Collect extension artifacts
        run: |
          mkdir -p artifacts/extension
          EXT_VERSION=$(node -p "require('./app/chrome-extension/package.json').version")
          EXT_ZIP="app/chrome-extension/.output/webpage-mcp-connector-${EXT_VERSION}-chrome-extension.zip"
          if [ ! -f "$EXT_ZIP" ]; then
            echo "Expected extension zip not found: $EXT_ZIP"
            ls -la app/chrome-extension/.output || true
            exit 1
          fi
          cp "$EXT_ZIP" artifacts/extension/

      - name: Generate checksums
        run: |
          (
            cd artifacts
            find . -type f ! -name 'SHA256SUMS.txt' -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Verify release artifacts against extension build
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/release-preflight.mjs artifacts artifacts --require-build-match --tag "$RELEASE_TAG"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ steps.verify_release_sha.outputs.release_sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  publish-github-release:
    name: Publish GitHub Release
    needs: build-assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout exact gated commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.build-assets.outputs.release_sha }}

      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ needs.build-assets.outputs.release_sha }}
          path: artifacts

      - name: Setup Node.js for publish verification
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Reverify release metadata and artifacts (archive-only; no build directory)
        run: node scripts/release-preflight.mjs artifacts artifacts --archive-only --tag "$GITHUB_REF_NAME"

      - name: Reverify release tag commit
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.build-assets.outputs.release_sha }}
        run: node scripts/verify-release-tag-sha.mjs --tag "$GITHUB_REF_NAME" --expected-sha "$EXPECTED_RELEASE_SHA"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ needs.build-assets.outputs.release_sha }}
          files: |
            artifacts/extension/*.zip
            artifacts/mcp/*.tgz
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true

  publish-npm:
    name: Publish MCP Server to npm
    needs: build-assets
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_npm == true))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout exact gated commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.build-assets.outputs.release_sha }}

      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ needs.build-assets.outputs.release_sha }}
          path: artifacts

      - name: Reverify npm publish ref
        run: node scripts/release-preflight.mjs npm-publish --ref "$GITHUB_REF"

      - name: Reverify release metadata and artifacts (archive-only; no build directory)
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/release-preflight.mjs artifacts artifacts --archive-only --tag "$RELEASE_TAG"

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure NPM token is configured
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: |
          if [ -z "$NPM_AUTH_TOKEN" ]; then
            echo "NPM_AUTH_TOKEN secret is required to publish."
            exit 1
          fi

      - name: Reverify release tag commit
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.build-assets.outputs.release_sha }}
        run: node scripts/verify-release-tag-sha.mjs --tag "$GITHUB_REF_NAME" --expected-sha "$EXPECTED_RELEASE_SHA"

      - name: Publish package
        run: |
          VERSION=$(node -p "require('./app/mcp-server/package.json').version")
          npm publish "artifacts/mcp/webpage-mcp-${VERSION}.tgz" --provenance --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
