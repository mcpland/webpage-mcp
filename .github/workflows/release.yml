name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish webpage-mcp to npm
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  # This is the public DER-SPKI body from Chrome Web Store, not a secret/private key.
  CHROME_EXTENSION_PUBLIC_KEY: ${{ vars.CHROME_EXTENSION_PUBLIC_KEY }}
  CHROME_EXTENSION_EXPECTED_ID: iehgbogeakiedihodennfcnigojnncag
  WEBPAGE_MCP_REQUIRE_EXTENSION_PUBLIC_KEY: "true"

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-assets:
    name: Build Release Assets
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/release-preflight.mjs metadata --tag "$RELEASE_TAG"

      - name: Verify npm publish ref
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_npm == true)
        run: node scripts/release-preflight.mjs npm-publish --ref "$GITHUB_REF"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install pinned Rust and WASM toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal --target wasm32-unknown-unknown
          cargo install wasm-pack --version '=0.15.0' --locked
          rustc --version
          wasm-pack --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck (shared + mcp)
        run: pnpm typecheck

      - name: Typecheck (extension)
        run: pnpm --filter webpage-mcp-connector compile

      - name: Test
        env:
          ENFORCE_COVERAGE: "true"
        run: |
          pnpm test:release
          pnpm test:workspace
          pnpm -r --if-present test

      - name: Verify reproducible WASM runtime
        run: |
          cargo test --manifest-path packages/wasm-simd/Cargo.toml --locked
          pnpm verify:wasm

      - name: Build workspace
        run: pnpm build

      - name: Build extension zip
        run: pnpm --filter webpage-mcp-connector zip

      - name: Pack MCP npm package
        run: |
          mkdir -p artifacts/mcp
          pnpm --dir app/mcp-server pack --pack-destination ../../artifacts/mcp

      - name: Collect extension artifacts
        run: |
          mkdir -p artifacts/extension
          EXT_VERSION=$(node -p "require('./app/chrome-extension/package.json').version")
          EXT_ZIP="app/chrome-extension/.output/webpage-mcp-connector-${EXT_VERSION}-chrome-extension.zip"
          if [ ! -f "$EXT_ZIP" ]; then
            echo "Expected extension zip not found: $EXT_ZIP"
            ls -la app/chrome-extension/.output || true
            exit 1
          fi
          cp "$EXT_ZIP" artifacts/extension/

      - name: Generate checksums
        run: |
          (
            cd artifacts
            find . -type f ! -name 'SHA256SUMS.txt' -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Verify release artifacts
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/release-preflight.mjs artifacts artifacts --tag "$RELEASE_TAG"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  publish-github-release:
    name: Publish GitHub Release
    needs: build-assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ github.sha }}
          path: artifacts

      - name: Reverify release metadata and artifacts
        run: node scripts/release-preflight.mjs artifacts artifacts --tag "$GITHUB_REF_NAME"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            artifacts/extension/*.zip
            artifacts/mcp/*.tgz
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true

  publish-npm:
    name: Publish MCP Server to npm
    needs: build-assets
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_npm == true))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ github.sha }}
          path: artifacts

      - name: Reverify npm publish ref
        run: node scripts/release-preflight.mjs npm-publish --ref "$GITHUB_REF"

      - name: Reverify release metadata and artifacts
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/release-preflight.mjs artifacts artifacts --tag "$RELEASE_TAG"

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure NPM token is configured
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: |
          if [ -z "$NPM_AUTH_TOKEN" ]; then
            echo "NPM_AUTH_TOKEN secret is required to publish."
            exit 1
          fi

      - name: Publish package
        run: |
          VERSION=$(node -p "require('./app/mcp-server/package.json').version")
          npm publish "artifacts/mcp/webpage-mcp-${VERSION}.tgz" --provenance --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
