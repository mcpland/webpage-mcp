[package]
name = "simd-math"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.126"
wide = "=0.7.33"
console_error_panic_hook = "=0.1.7"

[dependencies.web-sys]
version = "=0.3.103"
features = [
  "console",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
